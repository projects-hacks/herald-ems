# Protocol lookup (P9): how county documents are split into citable sections, and how updates are checked.
# The engine (herald/knowledge/) contains no county-specific rules; everything document-specific is here or in
# config/counties/<id>.json ("documents").
heading_styles:
  # Numbered protocol style: "3.2.1. If transport time ..." (700-A13, 700-S04)
  decimal: '^\s{0,12}(\d{1,2}(?:\.\d{1,2}){0,3})\.?\s{1,8}(\S.{1,160})$'
  # Policy outline style: "I. Purpose", "A. Patients shall ...", "1. The closest ...", "a. ..." (501, 602, 440)
  # The label type sets the level (I > A > 1 > a); indentation varies by document, so it doesn't gate detection.
  outline:
    - '^\s{0,8}([IVXL]{1,5})\.\s{1,10}(\S.{1,160})$'
    - '^\s{0,40}([A-Z])\.\s{1,10}(\S.{1,160})$'
    - '^\s{0,40}(\d{1,2})\.\s{1,10}(\S.{1,160})$'
    - '^\s{0,40}([a-z])\.\s{1,10}(\S.{1,160})$'
# A line that repeats on at least this share of a document's pages is a running header or footer.
running_line_share: 0.6
# Words glued by a broken font (ligatures lost in the text layer, e.g. "Abnormali.es"): the section is marked
# "text layer uncertain" and the page image is offered instead of trusting the words.
glyph_error_pattern: '[A-Za-z]{2,}[.9][a-z]{1,3}\b|[ﬀ-ﬆ]'
# Effective date as printed on the first page, read from each new version.
effective_pattern: 'Effective:\s+([A-Z][a-z]+ \d{1,2}, \d{4})'
search:
  top_k: 5
  rerank_depth: 8                       # passages the local model chooses from
  bm25_k1: 1.4
  bm25_b: 0.6
sync:
  interval_s: 60
  only_when_link: good          # updates arrive when the relay measures a good link
  timeout_s: 20
embedding:
  model: BAAI/bge-base-en-v1.5          # 110M parameters, runs on the CPU; English retrieval model
  query_prefix: "Represent this sentence for searching relevant passages: "
  device: cpu
  fusion_k: 60                          # reciprocal-rank fusion of keyword (BM25) and semantic ranks
