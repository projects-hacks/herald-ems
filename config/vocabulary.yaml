# Canonical patient-fact vocabulary. Extractors may only emit these keys (AGENTS.md invariant 7).
#   type:  int | float | str | bool | list | time | record (a structured event: `fields` name -> type, `identity`
#          the field that must be present; `field_ranges` plausibility per numeric field)
#   kind:  measure (goes to "missing" when absent) | history (goes to "not yet asked") | event (something done)
#   range: physical-plausibility bound, not a clinical threshold (rejects "sats 400"); a safety validator
#   merge: accumulate = list facts are unioned across utterances; each = every fact is its own event (a dose given)
#   require_tap: always starts unconfirmed (the medic confirms)
# contradiction_keys: two different values from different sources are a contradiction, not a trend.
# Words for people who give care or speak on scene, grouped (LABELING_GUIDE §3, §4e). They decide a record's `by`
# ("husband" -> family) and, on someone else's mic, the speaker's role (`speaker_roles`).
people: &people
  family: [husband, wife, spouse, partner, mother, father, mom, dad, parent, son, daughter, brother, sister,
           grandmother, grandfather, grandma, grandpa, grandson, granddaughter, aunt, uncle, cousin, boyfriend,
           girlfriend, fiance, niece, nephew, relative]
  facility: [nurse, aide, staff, nursing home staff, facility staff, caregiver, school nurse, home health aide,
             group home staff, care home staff]
  bystander: [friend, roommate, neighbor, neighbour, coworker, co-worker, witness, passerby, teacher, coach,
              lifeguard, security, security guard, store manager, clerk, stranger, golf partner, trainer,
              athletic trainer, supervisor, landlord]
  police: [officer, pd, cop, police officer, deputy, law enforcement]
  fire: [firefighter, fire department, engine, engine company, fd]
  first responder: [first responders, responder]
  crew: [we, us, ems, medic, paramedic, our crew]
# The role of a named speaker on someone else's mic, by people group (facility staff are family: LABELING_GUIDE §3).
speaker_roles: {family: [family, facility], bystander: [bystander, police, fire, first responder]}
