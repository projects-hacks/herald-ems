    kind: history
  allergies:
    label: Allergies
    type: list
    kind: history
  code_status:
    label: Code status (POLST/DNR)
    type: str
    kind: history
    require_tap: true
  ecg.twelve_lead_time:
    label: 12-lead time
    type: time
    kind: measure
  ecg.attached:
    label: 12-lead attached
    type: bool
    kind: measure
  ecg.stemi_reading:
    # The monitor's 12-lead interpretation reads STEMI / "acute MI suspected" (the county STEMI alert trigger, 700-A08).
    label: 12-lead reads STEMI
    type: bool
    kind: measure
  ecg.transmitted:
    label: 12-lead transmitted
    type: bool
    kind: measure
  ecg.territory:
    # Where the 12-lead shows the injury pattern, as the medic or the monitor states it ("inferior STEMI").
    # Herald never reads a 12-lead itself.
    label: 12-lead territory
    type: list
    kind: measure
    merge: accumulate
    enum: [inferior, anterior, septal, lateral, posterior, right ventricular]
  airway.status:
    # Policy 501 §III.A.5 airway status. A device placed is also a procedures.done event.
    label: Airway
    type: str
    kind: measure
    enum: [patent, patent with adjunct, supraglottic airway, endotracheal tube, bag-valve-mask ventilation, compromised]
  impression.primary:
    # Policy 501 §III.A.2 / NEMSIS eSituation.11: the crew's working impression in the medic's words. It is the
    # medic's statement, never a diagnosis made by Herald.
    label: Primary impression
    type: str
    kind: history
  triage.category:
    # SALT category for mass-casualty mode (TASK_SPECS S5): the medic's call, spoken or tapped, never Herald's.
    # Colors are words the model maps ("red tag" -> immediate), not synonyms coded here.
    label: Triage category (SALT)
    type: str
    kind: measure
    require_tap: true
    enum: [immediate, delayed, minimal, expectant, dead]
  transport.destination:
    label: Destination
    type: str
    kind: history
  transport.eta_min:
    label: ETA (min)
    type: int
    kind: history
    range:
    - 0
    - 600
  scene.notes:
    label: Scene notes
    type: list
    kind: measure
    merge: accumulate
contradiction_keys:
- allergies
- code_status
- meds.anticoagulant
- patient.age
- patient.sex
- stroke.lkw
- stroke.onset_witnessed
