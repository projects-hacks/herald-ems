# Canonical patient-fact vocabulary. Extractors may only emit these keys (AGENTS.md invariant 7).
#   type:  int | float | str | bool | list | time
#   kind:  measure (goes to "missing" when absent) | history (goes to "not yet asked")
#   range: physical-plausibility bound, not a clinical threshold (rejects "sats 400"); a safety validator
#   merge: accumulate = list facts are unioned across utterances
#   require_tap: always starts unconfirmed (the medic confirms)
# contradiction_keys: two different values from different sources are a contradiction, not a trend.
keys:
  patient.age:
    label: Age
    type: int
    kind: history
    range:
    - 0
    - 120
  patient.sex:
    label: Sex
    type: str
    kind: history
  complaint.chief:
    label: Chief complaint
    type: str
    kind: history
  symptom.onset:
    label: Symptom onset
    type: time
    kind: history
  stroke.lkw:
    label: Last known well
    type: time
    kind: history
  stroke.onset_witnessed:
    label: Onset witnessed
    type: bool
    kind: history
  stroke.deficits:
    label: Deficits
    type: list
    kind: measure
    merge: accumulate
  exam.race.facial:
    label: RACE facial palsy (0-2)
    type: int
    kind: measure
    range:
    - 0
    - 2
  exam.race.arm:
    label: RACE arm motor (0-2)
    type: int
    kind: measure
    range:
    - 0
    - 2
  exam.race.leg:
    label: RACE leg motor (0-2)
    type: int
    kind: measure
    range:
    - 0
    - 2
  exam.race.gaze:
    label: RACE head/gaze deviation (0-1)
    type: int
    kind: measure
    range:
    - 0
    - 1
  exam.race.aphasia_agnosia:
    label: RACE aphasia/agnosia (0-2)
    type: int
    kind: measure
    range:
    - 0
    - 2
  exam.gfast.gaze:
    label: G.F.A.S.T. gaze abnormalities (0-1)
    type: int
    kind: measure
    range:
    - 0
    - 1
  exam.gfast.facial:
    label: G.F.A.S.T. facial asymmetry (0-1)
    type: int
    kind: measure
    range:
    - 0
    - 1
  exam.gfast.arm_leg:
    label: G.F.A.S.T. arm or leg weakness/drift (0-1)
    type: int
    kind: measure
    range:
    - 0
    - 1
  exam.gfast.speech:
    label: G.F.A.S.T. speech difficulties (0-1)
    type: int
    kind: measure
    range:
    - 0
    - 1
  vitals.sbp:
    label: Systolic BP
    type: int
    unit: mmHg
    kind: measure
    range:
    - 0
    - 300
  vitals.dbp:
    label: Diastolic BP
    type: int
    unit: mmHg
    kind: measure
    range:
    - 0
    - 200
  vitals.hr:
    label: Heart rate
    type: int
    unit: /min
    kind: measure
    range:
    - 0
    - 300
  vitals.rr:
    label: Respiratory rate
    type: int
    unit: /min
    kind: measure
    range:
    - 0
    - 80
  vitals.spo2:
    label: SpO2
    type: int
    unit: '%'
    kind: measure
    range:
    - 0
    - 100
  vitals.temp:
    label: Temperature
    type: float
    unit: °C
    kind: measure
    range:
    - 25
    - 45
  vitals.glucose:
    label: Glucose
    type: int
    unit: mg/dL
    kind: measure
    range:
    - 1
    - 2000
  vitals.on_oxygen:
    label: Supplemental oxygen
    type: bool
    kind: measure
  vitals.consciousness:
    label: Consciousness (ACVPU)
    type: str
    kind: measure
  vitals.gcs_motor:
    label: GCS motor
    type: int
    kind: measure
    range:
    - 1
    - 6
  meds.list:
    label: Medications
    type: list
    kind: history
    merge: accumulate
  meds.anticoagulant:
    label: Anticoagulant
    type: str
    kind: history
  allergies:
    label: Allergies
    type: list
    kind: history
  code_status:
    label: Code status (POLST/DNR)
    type: str
    kind: history
    require_tap: true
  ecg.twelve_lead_time:
    label: 12-lead time
    type: time
    kind: measure
  ecg.attached:
    label: 12-lead attached
    type: bool
    kind: measure
  transport.destination:
    label: Destination
    type: str
    kind: history
  transport.eta_min:
    label: ETA (min)
    type: int
    kind: history
    range:
    - 0
    - 600
  scene.notes:
    label: Scene notes
    type: list
    kind: measure
    merge: accumulate
contradiction_keys:
- allergies
- code_status
- meds.anticoagulant
- patient.age
- patient.sex
- stroke.lkw
- stroke.onset_witnessed
