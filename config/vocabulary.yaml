  meds.given:
    # NEMSIS eMedications: 03 medication (RxNorm), 04 route, 05 dose, 06 unit; time and who gave it (TASKS O1).
    # before_arrival: given before this crew arrived (NEMSIS eMedications.02 "prior to EMS care"), e.g. by fire,
    # family or the patient; the handoff reports it apart from the crew's treatment.
    label: Medication given
    type: record
    kind: event
    merge: each
    identity: drug
    fields: {drug: str, dose: float, unit: str, route: str, time: time, by: str, count: int, before_arrival: bool}
    field_ranges: {dose: [0, 10000], count: [1, 20]}
    field_synonyms:                 # `by` is who gave it, as a category (the relation is in the fact's source)
      by: *people
  procedures.done:
    # NEMSIS eProcedures: 03 procedure, 01 time, successful or not; e.g. IV access, CPR, defibrillation, splint.
    label: Procedure done
    type: record
    kind: event
    merge: each
    identity: procedure
    fields: {procedure: str, time: time, detail: str, by: str, before_arrival: bool}
    field_synonyms:
      by: *people
  trauma.mechanism:
    label: Mechanism of injury
    type: str
    kind: history
  trauma.injury_time:
    # ATMIST "T", time of injury (Wood et al., Emerg Med J 2015): a clock time, like stroke.lkw.
    label: Time of injury
    type: time
    kind: history
  trauma.injuries:
    label: Injuries found
    type: list
    kind: measure
    merge: accumulate
  trauma.criteria:
    # Injury patterns and mechanisms from the national field-triage guideline (2021), in the words the county
    # Policy 605 uses (config/scores/trauma_605.yaml maps each to the county's criterion letter and citation). Vital-sign
    # criteria (GCS motor, RR, SpO2, SBP by age, HR > SBP), anticoagulants and pregnancy are computed from other
    # facts, never extracted here.
    label: Trauma criteria described
    type: list
    kind: measure
    merge: accumulate
    enum: [penetrating injury head neck torso or proximal extremity, skull deformity, spinal injury with new motor or sensory loss,
           chest wall instability, pelvic fracture, two or more proximal long bone fractures,
           crushed degloved mangled or pulseless extremity, amputation proximal to wrist or ankle,
           bleeding requiring tourniquet or wound packing, respiratory distress or need for respiratory support,
           ejection, intrusion or extrication, death in same passenger compartment, child unrestrained,
           rider separated with significant impact, rollover unrestrained, pedestrian or cyclist thrown or run over,
           fall over 10 feet, time sensitive extremity injury, low level fall with significant head impact, major burn]
  infection.suspected:
    label: Suspected infection (source)
    type: str
    kind: history
  patient.pregnancy_weeks:
    label: Pregnancy (weeks)
    type: int
    kind: history
