# The AI stack in HP's ZGX console terms (GET /api/stack). Status is computed live per component.
models:
  - {id: "openai/whisper-large-v3-turbo", component: stt, role: "speech-to-text"}
  - {id: "rajeev-chaurasia/herald-extractor-lora-merged-e2 (Qwen3-4B-Instruct-2507 + LoRA, run E v2)", served_as: "ems-e-v2-fp8",
     component: text_model, role: "speech-to-facts extraction (fine-tuned on this box, served in FP8)"}
  - {id: "Qwen/Qwen3-VL-30B-A3B-Instruct-FP8 (Apache-2.0)", served_as: "qwen3vl-fp8", component: vision_model,
     role: "photo reading (monitors, pill bottles, forms)"}
services:
  - {name: Deterministic scoring engine, detail: "NEWS2, RACE, G.F.A.S.T., 2021 field triage; published tables as reviewed data, unit-tested"}
  - {name: Gap-first alert checklists, detail: "stroke / STEMI pre-alert readiness from county configuration"}
  - {name: Provenance and contradiction engine, detail: "every fact linked to its audio or photo and speaker"}
  - {name: Grounding and plausibility validators, detail: "model facts must be supported by what was said; impossible values rejected"}
  - {name: Weak-link relay, detail: "prioritized, byte-budgeted, acknowledged updates of confirmed facts only"}
  - {name: Synthetic evaluation harness, detail: "held-out gold sets, 3-run benchmarks with spread (eval/)"}
