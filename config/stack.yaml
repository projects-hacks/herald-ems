# The AI stack in HP's ZGX console terms (GET /api/stack). Status is computed live per component.
models:
  - {id: "openai/whisper-large-v3-turbo", component: stt, role: "speech-to-text"}
  - {id: "rajeev-chaurasia/herald-extractor-lora-merged-e2 (Qwen3-4B-Instruct-2507 + LoRA, run E v2)", served_as: "ems-e-v2-fp8",
     component: text_model, role: "speech-to-facts extraction (fine-tuned on this box, served in FP8)"}
  - {id: "Qwen/Qwen3-VL-30B-A3B-Instruct-FP8 (Apache-2.0)", served_as: "qwen3vl-fp8", component: vision_model,
     role: "photo reading (monitors, pill bottles, forms)"}
  # Run F: ONE Qwen3-VL-30B-A3B + merged LoRA, trained on speech, photos, reranking, figures and translation
  # (MODEL_PLAN §0l). It is listed for both components below because the same served label answers both roles:
  # /api/stack computes status per component from the label actually being served, so without this entry a box
  # serving herald-f reported BOTH shipped models as "not served (serving herald-f)" on the AI-stack screen --
  # found during app integration, 2026-09-25.
  #
  # herald-f FAILED its own protocol-reranking kept-ability gate (right passage first 0.731 vs a required
  # >= 0.788; top 3 0.788 vs >= 0.827; see MODEL_CARD.md and eval/results.jsonl "bench": "vision:rerank",
  # model "herald-f"). It is served here for speech and photos ONLY -- the roles below say exactly that, on
  # purpose. Reranking, protocol-figure transcription and translation stay on the untuned `qwen3vl-fp8` above
  # (the split-stack option, TRAINING_PLAN §7a; docs/RUNBOOK.md §7). Do not add a reranking/figures/translation
  # role to the herald-f entries below until a future run passes that gate.
  - {id: "rajeev-chaurasia/herald-extractor-lora-merged-f (Qwen3-VL-30B-A3B + LoRA, run F epoch 2)",
     served_as: "herald-f", component: text_model,
     role: "speech-to-facts extraction (fine-tuned on this box, served in FP8)"}
  - {id: "rajeev-chaurasia/herald-extractor-lora-merged-f (Qwen3-VL-30B-A3B + LoRA, run F epoch 2)",
     served_as: "herald-f", component: vision_model,
     role: "photo reading (monitors, pill bottles, forms)"}
  - {id: "rajeev-chaurasia/herald-extractor-lora-merged-f4b (Qwen3-4B-Instruct-2507 + LoRA, run F 4B)",
     served_as: "herald-f4b-fp8", component: text_model,
     role: "speech-to-facts extraction, the text-only fallback (TRAINING_PLAN §7)"}
services:
  - {name: Deterministic scoring engine, detail: "NEWS2, RACE, G.F.A.S.T., 2021 field triage; published tables as reviewed data, unit-tested"}
  - {name: Gap-first alert checklists, detail: "stroke / STEMI pre-alert readiness from county configuration"}
  - {name: Provenance and contradiction engine, detail: "every fact linked to its audio or photo and speaker"}
  - {name: Grounding and plausibility validators, detail: "model facts must be supported by what was said; impossible values rejected"}
  - {name: Weak-link relay, detail: "prioritized, byte-budgeted, acknowledged updates of confirmed facts only"}
  - {name: Synthetic evaluation harness, detail: "held-out gold sets, 3-run benchmarks with spread (eval/)"}
