# A number the model writes for these keys must be a number that was said: as digits, or in words
# ("one sixty over ninety" -> 160, 90; herald/extraction/numbers.py). The check runs whether or not the utterance
# contains digits: "sugar reads HI on the meter, breathing deep and rapid" gave glucose 200 and RR 20 before
# (dev gold v1_088), and "any number word anywhere" was too loose ("vomiting for two days").
numbers_must_be_said:
- vitals.sbp
- vitals.dbp
- vitals.hr
- vitals.rr
- vitals.spo2
- vitals.glucose
- transport.eta_min
- vitals.gcs_eye
- vitals.gcs_verbal
- vitals.gcs_total
- vitals.pain
- vitals.etco2
- patient.pregnancy_weeks
- meds.given.dose                  # a record field: the dose of a medication given
- meds.given.count
# not listed: vitals.temp (converted from Fahrenheit), vitals.gcs_motor ("obeys commands" = 6), exam item scores
# (derived from the findings described), patient.age ("in her seventies" is kept as the model reads it)
# A zero is otherwise treated as invented for vitals; these can truly be 0 ("pain zero out of ten", EtCO2 in arrest).
zero_allowed: [vitals.pain, vitals.etco2]
# Number words are language data (config/numbers.yaml). A number counts as said when it is said in digits or in the
# words of any language listed here: patients and family at the scene often speak Spanish ("presión de ciento
# ochenta" -> 180), and a correct Spanish fact must not be dropped as unsaid (MODEL_PLAN §0k, Spanish speech).
spoken_numbers:
  file: numbers.yaml
  languages: [en, es]
# Grounding validator for model-extracted facts: a fact must be supported by words that were said.
# (Live test 2026-09-23: from 'sudden left-sided weakness' the model invented four RACE item scores.)
# key_requires_words: case-insensitive regex that must match the utterance for that key. The Spanish alternatives
# (after the English ones) keep a correct fact from Spanish speech (LABELING_GUIDE §5f): "orden de no resucitar" is a
# code status said, "la vi cuando se cayó" a witnessed onset, "le duele como un ocho de diez" a pain score.
filler_values:
- ''
- '?'
- unknown
- n/a
- na
- not stated
- not mentioned
- none stated
- 'null'
# A filler word that is a real answer for one key ("septic, no clear source" -> infection.suspected "unknown").
filler_allowed_for:
  infection.suspected: [unknown]
vitals_digits_must_appear: true
# A vital whose digits are not in the text is still grounded when the numbers were spoken as words
# ("pressure one sixty over ninety" in an utterance that also says "72 year old").
spoken_number_words: '\b(zero|oh|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred)\b'
vitals_digits_exempt:
- vitals.temp
key_requires_words:
  vitals.consciousness: alert|confus|disorient|voice|verbal|pain|unrespons|a ?& ?o|oriented|confund|orientad|\bvoz\b|\bdolor\b|no respond|inconscien|despiert|reconoc|\bgrit|cuando le habl|abr\w* los ojos|\ba y o\b
  code_status: dnr|polst|resusc|full code|dni|resucit|reanim|\bno (me |lo |la |le )?(revivan|reviva|intuben)\b
  exam.race.facial: face|facial|droop|smile|palsy|asymmetr|\bcara\b|\bboca\b|sonr[ií]|asimetr|chuec|torci
  exam.race.arm: \barm|\bbrazo
  exam.race.leg: \bleg|\bpierna
  exam.race.gaze: gaze|eyes?\b|look(ing|s)? (to|toward)|deviat|\bojos?\b|mirada|desv[ií]
  exam.race.aphasia_agnosia: speak|speech|aphasi|agnosi|recogni|neglect|words|habla|palabras|reconoc|entiende
  exam.gfast.gaze: gaze|eyes?\b|look(ing|s)? (to|toward)|deviat|\bojos?\b|mirada|desv[ií]
  exam.gfast.facial: face|facial|droop|smile|palsy|asymmetr|\bcara\b|\bboca\b|sonr[ií]|asimetr|chuec|torci
  exam.gfast.arm_leg: \barm|\bleg|weak|drift|\bbrazo|\bpierna|d[eé]bil|fuerza
  exam.gfast.speech: speak|speech|slur|aphasi|words|talk|habla|palabras|arrastra|lengua
  stroke.onset_witnessed: witness|saw (it|her|him)|in front of|found|woke|collapsed|watched|\bvi\b|\bvio\b|\bvimos\b|enfrente|delante de|encontr|despert|amaneci|llegu[eé]
  vitals.gcs_motor: gcs|motor|obey|command|localiz|withdraw|flex|extens|glasgow|obedece|[oó]rdenes|retira
  vitals.gcs_eye: gcs|glasgow|\be ?\d|eye|\bojos?\b|ocular
  vitals.gcs_verbal: gcs|glasgow|\bv ?\d|verbal
  vitals.gcs_total: gcs|glasgow|coma scale
  vitals.pain: pain|hurt|out of (10|ten)|/10|scale|rat(ing|es?) it|\bdolor|\bduel|de (10|diez)\b|\bescala\b|calific
  vitals.etco2: etco2|et co2|end.?tidal|capno|co2
