# A number the model writes for these keys must be a number that was said: as digits, or in words
# ("one sixty over ninety" -> 160, 90; herald/extraction/numbers.py). The check runs whether or not the utterance
# contains digits: "sugar reads HI on the meter, breathing deep and rapid" gave glucose 200 and RR 20 before
# (dev gold v1_088), and "any number word anywhere" was too loose ("vomiting for two days").
numbers_must_be_said:
- vitals.sbp
- vitals.dbp
- vitals.hr
- vitals.rr
- vitals.spo2
- vitals.glucose
- transport.eta_min
- vitals.gcs_eye
- vitals.gcs_verbal
- vitals.gcs_total
- vitals.pain
- vitals.etco2
- patient.pregnancy_weeks
- meds.given.dose                  # a record field: the dose of a medication given
- meds.given.count
# not listed: vitals.temp (converted from Fahrenheit), vitals.gcs_motor ("obeys commands" = 6), exam item scores
# (derived from the findings described), patient.age ("in her seventies" is kept as the model reads it)
# A zero is otherwise treated as invented for vitals; these can truly be 0 ("pain zero out of ten", EtCO2 in arrest).
zero_allowed: [vitals.pain, vitals.etco2]
spoken_numbers:
  units: {zero: 0, oh: 0, o: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9}
  teens: {ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17,
          eighteen: 18, nineteen: 19}
  tens: {twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90}
  hundred: [hundred]
  thousand: [thousand]
  point: [point]
  joiners: [and]
  one: [a, an]                     # "a hundred and ten"
# Grounding validator for model-extracted facts: a fact must be supported by words that were said.
# (Live test 2026-09-23: from 'sudden left-sided weakness' the model invented four RACE item scores.)
# key_requires_words: case-insensitive regex that must match the utterance for that key.
filler_values:
- ''
- '?'
- unknown
- n/a
- na
- not stated
- not mentioned
- none stated
- 'null'
# A filler word that is a real answer for one key ("septic, no clear source" -> infection.suspected "unknown").
filler_allowed_for:
  infection.suspected: [unknown]
vitals_digits_must_appear: true
# A vital whose digits are not in the text is still grounded when the numbers were spoken as words
# ("pressure one sixty over ninety" in an utterance that also says "72 year old").
spoken_number_words: '\b(zero|oh|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred)\b'
vitals_digits_exempt:
- vitals.temp
key_requires_words:
  vitals.consciousness: alert|confus|disorient|voice|verbal|pain|unrespons|a ?& ?o|oriented
  code_status: dnr|polst|resusc|full code|dni
  exam.race.facial: face|facial|droop|smile|palsy|asymmetr
  exam.race.arm: \barm
  exam.race.leg: \bleg
  exam.race.gaze: gaze|eyes?\b|look(ing|s)? (to|toward)|deviat
  exam.race.aphasia_agnosia: speak|speech|aphasi|agnosi|recogni|neglect|words
  exam.gfast.gaze: gaze|eyes?\b|look(ing|s)? (to|toward)|deviat
  exam.gfast.facial: face|facial|droop|smile|palsy|asymmetr
  exam.gfast.arm_leg: \barm|\bleg|weak|drift
  exam.gfast.speech: speak|speech|slur|aphasi|words|talk
  stroke.onset_witnessed: witness|saw (it|her|him)|in front of|found|woke|collapsed|watched
  vitals.gcs_motor: gcs|motor|obey|command|localiz|withdraw|flex|extens
  vitals.gcs_eye: gcs|glasgow|\be ?\d|eye
  vitals.gcs_verbal: gcs|glasgow|\bv ?\d|verbal
  vitals.gcs_total: gcs|glasgow|coma scale
  vitals.pain: pain|hurt|out of (10|ten)|/10|scale|rat(ing|es?) it
  vitals.etco2: etco2|et co2|end.?tidal|capno|co2
