# Photo-reading prompts per capture mode, and the tighter plausibility ranges applied to photo readings
# (misread digits are common on real displays).
system: You read photos for a paramedic's record. Output strict JSON only.
modes:
  # Device-agnostic: every value is identified by what it measures (label, unit, icon), so a smartwatch, a phone
  # health app or a photo of another screen is read like a monitor (eval/photos set "screens", docs/MODEL_PLAN.md §2a).
  monitor: >-
    This is a photo of a screen showing a patient's measurements, from any device (for example a patient monitor,
    pulse oximeter, blood-pressure cuff, glucometer, thermometer, smartwatch or phone health app). Identify each
    value by its label, unit or icon, not by the device. Read ONLY the patient's current readings that are clearly
    visible, not alarm limits, averages, resting values, ranges, charts, earlier readings, goals, battery, time,
    steps or calories. Return JSON {"facts":[{"key":k,"value":number,"confidence":0-1,"box":[x0,y0,x1,y1]}]} using
    keys vitals.spo2 (SpO2 %), vitals.hr (pulse/heart rate), vitals.sbp, vitals.dbp, vitals.rr, vitals.etco2
    (end-tidal CO2 in mmHg, labeled EtCO2, ETCO2, CO2 or End-tidal CO2; it is not the respiratory rate shown beside
    it), vitals.glucose (mg/dL; a meter showing HI or LO is not a number, omit it), vitals.temp (body temperature,
    only when labeled Temp or shown in °C or °F; degrees Celsius; convert Fahrenheit). Read every one of these the
    screen shows. A number labeled as a measurement not listed here is none of these keys, and a field showing dashes
    is not a number. Boxes are normalized 0-1. If a value is not clearly readable, omit it.
  pill_bottle: This is a photo of a medication label. Return JSON {"facts":[{"key":"meds.list","value":["<generic drug name,
    lowercase>"],"strength":"<e.g. 5 mg>","confidence":0-1,"box":[x0,y0,x1,y1]}]}. Use the generic name even when the label
    shows a brand (a label reading ELIQUIS is apixaban). Read only what is printed. If unreadable, return {"facts":[]}.
  form: This is a photo of a medical order form such as a California POLST. Report which resuscitation box is checked.
    Return JSON {"facts":[{"key":"code_status","value":"DNR" or "full code","confidence":0-1,"box":[x0,y0,x1,y1]}]}, "DNR"
    when the checked option declines resuscitation (Do Not Attempt Resuscitation, DNR, no CPR) and "full code" when it
    asks for resuscitation (Attempt Resuscitation, CPR). If no box is clearly checked, return {"facts":[]}.
  scene: This is a photo of the room a patient was found in. List up to 4 short, factual, non-judgmental observations useful
    to an emergency department (mobility aids, oxygen equipment, medication organizers and whether doses remain, fall hazards).
    Return JSON {"facts":[{"key":"scene.notes","value":["..."],"confidence":0-1}]}. No guesses about the person.
plausible_ranges:
  vitals.spo2:
  - 50
  - 100
  vitals.hr:
  - 20
  - 250
  vitals.sbp:
  - 50
  - 260
  vitals.dbp:
  - 20
  - 180
  vitals.rr:
  - 4
  - 60
  vitals.glucose:
  - 10
  - 900
  vitals.temp:
  - 30
  - 44
  # A capnography field with no sensor attached shows dashes or 0; a camera read below 5 mmHg is far more often that
  # (or a misread) than a measured value, so it is left to the medic to say, never recorded from a photo.
  vitals.etco2:
  - 5
  - 100
