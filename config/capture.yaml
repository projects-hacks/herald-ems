# S9 interaction policy; engineering defaults pending mounted-camera acceptance, not clinical thresholds.
fps_in: 1                    # One input frame each second bounds CPU and network work.
max_frame_bytes: 1048576      # One MiB encoded frame cap, checked before decoding.
max_side: 1280               # Longest accepted image dimension; S9 wire limit.
buffer_s: 6                  # Recent evidence only; S9 privacy window.
max_frames: 8                # Hard cap even when source timestamps are bad.
queue_size: 16               # Bounded pending event captures, coalesced by trigger/fact.
decision_history: 30         # Bounded status history, never raw images.
poll_s: 0.2                 # CPU task polls for source frames and ready intents.
manual_window_s: 2          # S9: most recent manual evidence or next arriving frame.
manual_wait_s: 10           # A manual request expires instead of waiting indefinitely.
gate:
  sharp_min: 60             # Variance of the grey 3x3 Laplacian at gate resolution.
  change_min: 0.06          # Mean absolute grey difference divided by 255.
  bright_min: 25            # Reject underexposed frames on the 0..255 grey scale.
  bright_max: 235           # Reject overexposed frames on the same scale.
  width: 320                # Cheap filter resolution; no model on the frame path.
rate:
  auto_calls_per_s: 0.1     # At most one automatic admission every ten seconds.
  max_in_flight: 1          # No overlapping frame reads, including manual requests.
  skip_while_speech: true
monitor:
  roi_margin: 0.10          # Ten percent of ROI width/height on each side, clipped to image.
  stable_frames: 2          # Two successive usable ROI frames before automatic monitor reading.
  # Cadence of monitor-watch reads (herald/capture/policy.py `on_tick`). Engineering values from MEASURED CONTENTION on
  # one served model, not clinical rules. Revisit them when the contention changes (a second served model, a faster
  # read), not as a safety limit.
  #   2026-09-25 (scripts/measure_capture_overlap.py, one served 30B): a monitor read took 5.4 s alone and 7.2 s while
  #     speech was processed, and the speech leg went 3.3 s -> 6.6 s against an ~8 s ambient clip cadence. At a fixed
  #     15 s the camera was busy ~40% of the time, so most clips paid the contended cost; at 30 s ~18%. The interval was
  #     raised 15 -> 30 (owner), which left the trend with a point every 30-60 s.
  #   2026-09-26 (herald-f on :8080, the monitor simulator at 1280x800, 5 readings; a live test was running on the same
  #     server): one read took 3.7-5.6 s with the old four-vital prompt and 4.6-7.2 s reading all five (EtCO2 added).
  # The contention only costs anything while somebody is talking: the cabin microphone uploads speech only (the
  # client's endpointer), so a quiet cabin has nothing for a read to slow down. So the cadence follows the speech:
  min_interval_s: 15          # Speech idle: one read every 15 s, twice the old trend density. A <=7 s read keeps the
                              # camera busy <=47% of a quiet spell; the only cost is to the first utterance after the
                              # quiet, which may land on a read already in flight (+3.3 s measured, once).
  speech_interval_s: 30       # Speech processed within the last speech_quiet_s: back off to the measured-safe 30 s
                              # (~18-23% busy). The scheduler still never STARTS a read while speech is in flight
                              # (rate.skip_while_speech).
  speech_quiet_s: 16          # Two ambient clip gaps (~8 s each) with no speech processed = the talking has paused.
  max_interval_s: 30          # A trend point at least this often even when the picture looks unchanged
                              # (`monitor_refresh`). Never dropped as a duplicate: a repeat value is still a current
                              # reading. Must be >= min_interval_s.
  # The agent's sanity check on a monitor reading before it enters the record as a confirmed device reading
  # (config/confirmation.yaml `monitor_readings`; herald/capture/sanity.py). A reading that moved further than
  # `max_step` from the previous monitor reading of the same vital taken within `window_s` is recorded but HELD
  # (unconfirmed, with `reason`) for the medic, so a misread digit (116 -> 16, 94 -> 49) never silently enters the
  # record. A later reading that agrees with the held one (within max_step of it) is recorded confirmed: a real change
  # repeats, a transient misread does not. The limits are deliberately far wider than config/corroboration.yaml
  # `plausible_step` and config/trends.yaml: those mark a change worth a look; these mark a move too fast to trust from
  # one camera read. Engineering defaults for misread detection, pending review on real monitor footage; not
  # clinical thresholds, and never a statement about the patient. The simulator journey
  # (ui/public/fixtures/monitor_journey.json) moves at most HR 14, SBP 14, SpO2 3, RR 4, EtCO2 5 between its steps.
  jump:
    window_s: 120             # Only a previous reading this recent (frame time) is a reference; older ones are not.
    max_step:
      vitals.hr: 40           # /min
      vitals.sbp: 40          # mmHg
      vitals.dbp: 30          # mmHg
      vitals.spo2: 10         # percentage points
      vitals.rr: 12           # /min
      vitals.etco2: 15        # mmHg
      vitals.temp: 1.5        # degrees C
      vitals.glucose: 100     # mg/dL
    # Shown on the held reading. Fields: {label} {value} {previous} {delta} {seconds} {limit}.
    reason: "Monitor read {label} {value}, {delta} from {previous} {seconds} s earlier: check the monitor, then confirm or correct"
  # gate: the monitor-watch gate profile. These values REPLACE the matching keys of the global `gate:` block when the
  # agent assesses the camera ROI for monitor-watch. The global values stay as they are: they protect the one-shot
  # photo path, where a whole new scene is expected to differ from the last one. Engineering defaults pending
  # mounted-camera tuning, NOT clinical thresholds; retune with scripts/capture/gate_probe.py --dir <real frames>.
  #
  # Measured 2026-09-25, pure CPU, synthetic renders of a camera photo of a laptop showing a monitor UI
  # (scripts/capture/gate_probe.py). Against the global values the gate could never fire on a screen:
  #   dark UI, full frame, one vital changing        change 0.0022   (global change_min 0.06)
  #   ROI=screen on the dark UI                      bright   18.8   (global bright_min 25: not even `usable`,
  #                                                                   so monitor_refresh never ran either)
  #   ROI=screen on a white UI                       bright  238.3   (global bright_max 235)
  #   tightest ROI around only the changing number   change 0.0589   (still under 0.06)
  #   ROI=screen, one vital changing                 change 0.0075 (dark UI) / 0.0046 (white UI)
  #   ROI=screen, four vitals changing               change 0.0209 (dark UI) / 0.0168 (white UI)
  # Synthetic renders UNDERSTATE change: only the changed digits differ, while a real camera adds noise, exposure
  # drift and small motion to every pixel. Read these as a floor.
  gate:
    change_min: 0.004       # Below the measured single-vital change on a screen-sized ROI for BOTH a dark UI
                            # (0.0075) and a white UI (0.0046), with margin. A false "changed" costs one VLM read
                            # and is bounded by min_interval_s (15 s); a missed change loses a trend point, so the
                            # threshold errs low. Duplicate values are dropped again after the read
                            # (herald/capture/reading.py `unchanged`), so a jumpy gate does not add facts.
    bright_min: 12          # Admits the measured 18.8 of a dark monitor UI seen through a camera.
    bright_max: 245         # Admits the measured 238.3 of a white monitor UI.
    # `stable_max` is the ROI difference below which two successive frames count as the same picture
    # (CaptureAgent.receive -> CapturePolicy.stable_frames). It is deliberately NOT change_min: a screen has to
    # settle, and at 0.005 real camera noise alone would keep the ROI "moving" forever and no read would happen.
    # 0.06 keeps today's behaviour (it was the global change_min); it is the first value to retune on real frames.
    stable_max: 0.06
triggers:
  - {'on': fact, key: meds.given, where: {by: crew}, mode: pill_bottle, purpose: verify, window_s: 8, reason: 'Crew medication recorded: check the visible label'} # Look-back/expiry in seconds.
  - {'on': fact, key: meds.list, mode: pill_bottle, purpose: record, window_s: 8, reason: 'Medication history recorded: read the visible label'} # Recent medication evidence.
  - {'on': fact, key: meds.anticoagulant, mode: pill_bottle, purpose: record, window_s: 8, reason: 'Anticoagulant recorded: read the visible label'} # Recent label evidence.
  - {'on': fact, key: code_status, mode: form, purpose: record, window_s: 10, reason: 'Code status recorded: read the visible form'} # Document capture window.
  - {'on': alert_new, mode: monitor, purpose: record, window_s: 6, reason: 'New alert: read the monitor'} # Recent monitor evidence.
  - {'on': eta_changed, when: {lte: 5}, mode: monitor, purpose: record, once: true, window_s: 6, reason: 'Arrival approaching: refresh monitor readings'} # Five minutes to handoff; once per incident.
reasons:
  monitor_changed: 'Monitor image changed: propose a fresh reading'
  monitor_refresh: 'Periodic monitor refresh: retain a current trend point'
suppress_during: [cpr_in_progress]
record_keys:
  monitor: [vitals.]
  pill_bottle: [meds.list, meds.anticoagulant]
  form: [code_status]
  scene: [scene.]
verify:
  dose_key: meds.given
  drug_field: drug
  label_key: meds.list
  trusted_methods: [exact, combination, contained]
  mismatch: 'Said {said}; label seen: {label}: check before confirming'
  pending: 'Label check pending: verify before confirming'
privacy:
  store: used_only
  blur_faces: true
  dir: auto
  scale_factor: 1.1         # Haar image-pyramid scale; OpenCV default detector tradeoff.
  min_neighbors: 5         # Require five neighboring candidate detections.
  min_face_px: 24          # Minimum face box at detector resolution.
  blur_sigma: 30          # Gaussian blur strength on stored evidence only.
