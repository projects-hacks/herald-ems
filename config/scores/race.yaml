id: race
name: RACE
kind: item_sum
# Evidence updated 2026-09-23: the original single-centre figures (sens 0.85, spec 0.68) overstate field
# performance; the screen shows the pooled estimate.
source: Pérez de la Ossa N et al., Stroke 2014;45:87-91 (RACE scale)
evidence: >-
  RACE >= 5 for large-vessel occlusion, pooled across 9 studies: sensitivity 0.75, specificity 0.76
  (Suzuki H et al., J Am Heart Assoc 2026;15:e048588)
thresholds_text: ">= 5 = large-vessel occlusion screen positive"
items:
  - {key: exam.race.facial, label: Facial palsy, max: 2}
  - {key: exam.race.arm, label: Arm motor, max: 2}
  - {key: exam.race.leg, label: Leg motor, max: 2}
  - {key: exam.race.gaze, label: Head and gaze deviation, max: 1}
  - {key: exam.race.aphasia_agnosia, label: Aphasia or agnosia, max: 2}
positive_at_least: 5
alert_type: race_positive
relay_text: "{score} {result}"
