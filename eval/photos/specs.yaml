  # ================= set "screens" (added 2026-09-24): consumer and unfamiliar screens =================
  # Screen types the monitor prompt was never tuned on: smartwatch faces, phone health / fitness / glucose /
  # thermometer apps, a wrist BP cuff that marks the pulse only with a heart icon, and a tablet showing a picture of
  # a bedside monitor. `set: screens` puts them in their own group in the bench (per_set), so the original 45
  # images stay comparable with every earlier run.
  #
  # What counts as the patient's current reading (labeling rules for screens; LABELING_GUIDE §4 normalization):
  #   - COUNTS: the single most recent value of a measurement, shown as its main number or marked "Latest",
  #     "Now", "just now", or the result of a measurement that was just taken (a watch ECG recording's heart rate
  #     is the heart rate of that 30 s recording, even though the screen calls it "Average"; a cuff's result).
  #   - DOES NOT COUNT: resting heart rate, daily / weekly averages, min-max ranges, charts and trends, goals,
  #     targets and thresholds (a CGM's 70-180 target band, a fever threshold), earlier entries in a history
  #     list, changes from a personal baseline (skin temperature variation), HRV, time in range, and non-vitals
  #     (clock, date, battery %, steps, distance, calories, sleep, floors, active minutes, memory-slot numbers).
  #   - A rhythm label ("Sinus Rhythm") is not a fact: Herald reads numbers from photos and interprets no ECG.
  #   - Temperature in Celsius with one decimal: the app's 101.3 °F is gold 38.5.
  - id: watch_01_round_hr
    set: screens
    device: smartwatch
    shape: round
    app: heart_rate
    mode: monitor
    clock: "10:09"
    values: {vitals.hr: 72}
    notes: round watch face; a heart icon, 72 and BPM, no "heart rate" label; the clock is not a vital
    degrade: []
  - id: watch_02_rect_spo2
    set: screens
    device: smartwatch
    shape: rect
    app: blood_oxygen
    mode: monitor
    clock: "10:14"
    values: {vitals.spo2: 97}
    notes: rectangular watch, blood-oxygen app, 97%
    degrade: []
  - id: watch_03_ecg_result
    set: screens
    device: smartwatch
    shape: rect
    app: ecg
    mode: monitor
    clock: "10:21"
    values: {vitals.hr: 78}
    notes: watch ECG result "Sinus Rhythm, 78 BPM Average" after a 30 s recording; the recording's rate is the current heart rate; the rhythm label is not a fact
    degrade: [{kind: jpeg, quality: 30}]
  - id: watch_04_round_hr_resting_tilt
    set: screens
    device: smartwatch
    shape: round
    app: heart_rate
    label: Heart Rate
    mode: monitor
    clock: "2:47"
    values: {vitals.hr: 118}
    resting: 64
    ago: Now
    notes: current heart rate 118 with "Resting 64 BPM" below it (resting is not the current reading); tilted, glare
    degrade: [{kind: glare, at: [0.62, 0.30], size: 0.18, strength: 0.6}, {kind: perspective, strength: 0.15}]
  - id: phone_01_health_summary
    set: screens
    device: phone_app
    style: light
    mode: monitor
    title: Summary
    subtitle: Pinned
    clock: "10:05"
    battery: 64
    values: {vitals.hr: 88, vitals.spo2: 95, vitals.sbp: 128, vitals.dbp: 82}
    cards:
      - {title: Heart Rate, icon: heart, color: red, note: "Latest, 2 min ago", key: vitals.hr, unit: BPM}
      - {title: Blood Oxygen, icon: drop, color: blue, note: "10:02 AM", key: vitals.spo2, unit: "%"}
      - {title: Blood Pressure, icon: heart, color: purple, note: "Today 8:05 AM", keys: [vitals.sbp, vitals.dbp], unit: mmHg}
      - {title: Steps, icon: shoe, color: orange, note: Today, value: "6,214", unit: steps}
      - {title: Active Energy, icon: flame, color: orange, note: Today, value: "312", unit: kcal}
      - {title: Resting Heart Rate, icon: heart, color: red, note: Today, value: "61", unit: BPM}
      - {title: Sleep, icon: moon, color: teal, note: Last night, value: "6 hr 42 min"}
    notes: health-app summary; current = latest heart rate 88, blood oxygen 95, blood pressure 128/82; distractors resting HR 61, steps, calories, sleep, battery 64%
    degrade: []
  - id: phone_02_hr_week_tilt
    set: screens
    device: phone_app
    style: light
    mode: monitor
    back: Heart
    title: Heart Rate
    clock: "9:41"
    values: {vitals.hr: 104}
    chart: {kind: range_bars, header: RANGE, big: "58-142", unit: BPM, sub: "Sep 18-24, 2026", axis: [40, 160],
            gridlines: [60, 100, 140], low: 58, high: 142, peak_day: 4, color: red}
    cards:
