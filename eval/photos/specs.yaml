      - {title: Resting, color: red, note: This week, value: "66", unit: BPM}
      - {title: Average, color: red, note: This week, value: "82", unit: BPM}
    notes: 7-day heart-rate chart with a 58-142 range header (not a reading); current = Latest 104; resting 66 and average 82 are not current; tilted
    degrade: [{kind: perspective, strength: 0.14}]
  - id: phone_03_dark_vitals
