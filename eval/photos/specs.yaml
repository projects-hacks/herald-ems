      - {title: Steps, icon: shoe, color: orange, note: "Goal 10,000", value: "8,432"}
      - {title: Distance, icon: shoe, color: blue, note: Today, value: "3.9", unit: mi}
      - {title: Active calories, icon: flame, color: red, note: "Goal 500", value: "412", unit: kcal}
      - {title: Active minutes, color: green, note: Today, value: "38", unit: min}
      - {title: Floors climbed, color: purple, note: Today, value: "9"}
    notes: fitness app with only activity numbers (steps, distance, calories, minutes, floors, goals, battery); no patient vital, so no fact
    degrade: []
  - id: phone_06_thermometer_dim
    set: screens
    device: phone_app
    style: light
    mode: monitor
