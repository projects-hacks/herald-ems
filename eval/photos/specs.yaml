# Synthetic photo test set for the vision-model bake-off: what each image shows.
#
# `python eval/photos/make_photos.py` renders every item below into eval/photos/<id>.jpg and writes
# eval/photos/gold.jsonl. The gold facts come ONLY from these rendering parameters (never from a model):
#   - `values` are canonical vocabulary keys (config/vocabulary.yaml) with values normalized as in
#     docs/LABELING_GUIDE.md §4 (integers; temperature in Celsius with one decimal);
#   - a field hidden by an `occlusion` degradation is removed from the gold, because it is not in the image;
#   - pill labels give meds.list = [generic] and, for anticoagulants, meds.anticoagulant = generic (§4, §5a:
#     antiplatelets are not anticoagulants); the printed names are accepted aliases (the photo prompt asks for
#     "generic or brand drug name");
#   - forms give code_status "DNR" / "full code" (§4); the printed option text is an accepted alias (the photo
#     prompt asks for the option "exactly as printed").
# Everything is fictitious: no real patient, prescriber, pharmacy, or prescription number.
#
# Degradations (applied in this order by make_photos.py): occlusion, glare, perspective, rotation, blur,
# motion_blur, low_light, jpeg. Parameters are fixed here so the set is reproducible.

seed: 20260924
canvas: [1024, 768]
jpeg_quality: 90

# Printed option text on the synthetic POLST-style form, and the canonical value each one means.
forms:
  polst:
    title: PHYSICIAN ORDERS FOR LIFE-SUSTAINING TREATMENT
    section_a:
      heading: "A  CARDIOPULMONARY RESUSCITATION (CPR): if the patient has no pulse and is not breathing"
      options:
        cpr: {text: "YES CPR: Attempt Resuscitation, including mechanical ventilation", canonical: full code}
        dnr: {text: "NO CPR: Do Not Attempt Resuscitation", canonical: DNR}
    section_b:
      heading: "B  INITIAL TREATMENT ORDERS: if the patient has a pulse and/or is breathing"
      options:
        full: "Full Treatment"
        selective: "Selective Treatment"
        comfort: "Comfort-Focused Treatment"

