      - {title: Breathing rate, icon: lungs, color: teal, note: Just now, key: vitals.rr, unit: br/min}
      - {title: Skin temperature, icon: thermometer, color: orange, note: vs. baseline, value: "+0.4", unit: "°C"}
      - {title: Heart rate variability, icon: heart, color: purple, note: Today, value: "28", unit: ms}
      - {title: Steps, icon: shoe, color: green, note: Today, value: "3,120"}
    notes: dark app with several metrics; current = heart rate 96, SpO2 93, breathing rate 22; skin temperature variation +0.4 °C vs baseline is not a body temperature; HRV 28 ms, steps and battery 31% are not vitals
    degrade: [{kind: jpeg, quality: 28}]
  - id: phone_04_cgm_glucose_rot
    set: screens
    device: phone_app
    style: dark
    mode: monitor
    title: Glucose
    clock: "11:30"
    values: {vitals.glucose: 142}
    hero: {key: vitals.glucose, unit: mg/dL, arrow: "→", color: green, notes: ["Steady, sensor reading 1 min ago"]}
    chart: {kind: line, axis: [40, 300], gridlines: [70, 180, 250], start: 118, end: 142, color: green,
            x_labels: ["8 AM", "9 AM", "10 AM", "11 AM"]}
    cards:
      - {title: Time in Range, color: green, note: 24 hours, value: "78", unit: "%"}
      - {title: Average glucose, color: grey, note: 14 days, value: "151", unit: mg/dL}
    notes: continuous-glucose-monitor app; current = 142 mg/dL; target band lines 70 and 180, the 3-hour chart, time in range 78% and the 14-day average 151 are not current readings; rotated
    degrade: [{kind: rotation, angle: 8}]
  - id: phone_05_fitness_only
    set: screens
    device: phone_app
    style: light
    mode: monitor
    title: Activity
    subtitle: Today
    clock: "5:18"
    battery: 92
