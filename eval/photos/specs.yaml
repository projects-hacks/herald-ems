    notes: wrist BP cuff; SYS 146, DIA 92, pulse 88 marked only by a heart icon and /min; the date, time and memory slot M 12 are not vitals; glare
    degrade: [{kind: glare, at: [0.30, 0.22], size: 0.14, strength: 0.55}]
  - id: screen_01_tablet_monitor_angle
