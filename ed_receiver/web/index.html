<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ED · Incoming ambulances</title><link rel="stylesheet" href="/screen.css"></head>
<body><header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">✚</span><span>Emergency Department</span><span class="board">Incoming ambulances</span></div>
<p id="connection" role="status">Connecting…</p><p id="contact">Last vehicle contact: unknown</p><time id="clock"></time></header>
<div class="layout"><nav id="patients" aria-label="Incoming patients" hidden></nav>
<main><div id="root"><p class="waiting">No incoming patients. Waiting for the ambulance…</p></div>
<details class="card report-box" id="report-box" hidden><summary>Received-data handoff report</summary><div id="report" aria-label="Received handoff report"></div></details></main></div>
<script type="module" src="/app.js"></script></body></html>
